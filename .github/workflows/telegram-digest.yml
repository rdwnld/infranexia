name: telegram-digest

on:
  # Produksi: 3x sehari WIB (cron GitHub memakai UTC, WIB = UTC+7).
  #   08:30 WIB -> 01:30 UTC | 12:00 WIB -> 05:00 UTC | 16:30 WIB -> 09:30 UTC
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 5 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch: # tombol "Run workflow" manual untuk tes

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kirim digest ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-digest.mjs

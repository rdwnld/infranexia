name: telegram-overdue-0800

on:
  # Dipicu oleh scheduler eksternal (cron-job.org) tepat jam 08.00 WIB setiap hari
  # via API workflow_dispatch. Blok schedule bawaan GitHub sengaja dihapus
  # karena antreannya telat berjam-jam (terbukti 3 hari berturut-turut).
  workflow_dispatch: # tombol "Run workflow" manual untuk tes

jobs:
  overdue-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kirim alert overdue ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-digest.mjs

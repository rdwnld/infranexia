name: telegram-overdue-0800

on:
  # Alert overdue otomatis tiap jam 08.00 WIB setiap hari.
  # Cron GitHub memakai UTC; WIB = UTC+7, jadi 08.00 WIB = 01.00 UTC.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: # tombol "Run workflow" manual untuk tes

jobs:
  overdue-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kirim alert overdue ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-digest.mjs
